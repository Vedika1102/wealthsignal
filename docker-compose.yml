services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wealthsignal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wealthsignal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-07-31T05-46-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline-worker:
    build:
      context: .
      dockerfile: services/pipeline_worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/wealthsignal}
      WEALTHSIGNAL_OBJECT_STORAGE_ENDPOINT: ${WEALTHSIGNAL_OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      WEALTHSIGNAL_OBJECT_STORAGE_ACCESS_KEY: ${WEALTHSIGNAL_OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      WEALTHSIGNAL_OBJECT_STORAGE_SECRET_KEY: ${WEALTHSIGNAL_OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      WEALTHSIGNAL_OBJECT_STORAGE_BUCKET: ${WEALTHSIGNAL_OBJECT_STORAGE_BUCKET:-wealthsignal-filings}
      WEALTHSIGNAL_OBJECT_STORAGE_REGION: ${WEALTHSIGNAL_OBJECT_STORAGE_REGION:-us-east-1}
      WEALTHSIGNAL_OBJECT_STORAGE_SECURE: ${WEALTHSIGNAL_OBJECT_STORAGE_SECURE:-false}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8090}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "${WORKER_HEALTH_PORT:-8090}:8090"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  decision-api:
    build:
      context: .
      dockerfile: services/decision_api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/wealthsignal}
      WEALTHSIGNAL_DB_PATH: /app/data/wealthsignal.db
    depends_on:
      postgres:
        condition: service_healthy
      pipeline-worker:
        condition: service_healthy
    ports:
      - "${DECISION_API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
