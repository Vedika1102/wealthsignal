[project]
name = "wealthsignal"
version = "0.1.0"
description = "Institutional holdings intelligence platform built on SEC 13F filings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "fastapi>=0.115.0",
    "joblib>=1.4.2",
    "mlflow>=2.16.0",
    "numpy>=2.0.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.8.0",
    "scikit-learn>=1.5.1",
    "shap>=0.46.0",
    "uvicorn>=0.30.0",
    "xgboost>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = [
    "services/pipeline_worker/tests",
]

[tool.setuptools.package-dir]
"" = "services/pipeline_worker/src"

[tool.setuptools.packages.find]
where = ["services/pipeline_worker/src"]
